name: ci

on:
  push:
  pull_request:

jobs:
  selftest:
    name: selftest (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 自测不依赖任何第三方包，也不需要 DeepSeek Harness 运行时。
      - name: Run offline selftest
        run: node scripts/selftest.mjs
